name: Build Funcora

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Increase Windows Pagefile (Virtual Memory)
        shell: pwsh
        run: |
          $System = Get-CimInstance -ClassName Win32_ComputerSystem
          $System | Set-CimInstance -Property @{AutomaticManagedPagefile = $false}
          $PageFile = Get-CimInstance -ClassName Win32_PageFileSetting
          if ($PageFile) {
            $PageFile | Set-CimInstance -Property @{InitialSize = 8192; MaximumSize = 16384}
          } else {
            New-CimInstance -ClassName Win32_PageFileSetting -Property @{Name = "C:\pagefile.sys"; InitialSize = 8192; MaximumSize = 16384}
          }

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install --upgrade nuitka ordered-set zstandard
          pip install pyside6 sympy numpy matplotlib pillow

      - name: Build Funcora
        shell: cmd    
        run: |
          python -m nuitka ^
            --standalone ^
            --jobs=1 ^
            --low-memory ^
            --lto=no ^
            --msvc=latest ^
            --assume-yes-for-downloads ^
            --windows-console-mode=disable ^
            --windows-icon-from-ico=assets/icon.ico ^
            --enable-plugin=pyside6 ^
            --enable-plugin=numpy ^
            --include-module=matplotlib.backends.backend_qtagg ^
            --include-module=matplotlib.backends.backend_qt ^
            --include-data-dir=assets=assets ^
            --nofollow-import-to=tkinter ^
            --nofollow-import-to=IPython ^
            --nofollow-import-to=jupyter ^
            --nofollow-import-to=pytest ^
            --nofollow-import-to=sympy.testing ^
            --nofollow-import-to=sympy.physics ^
            --nofollow-import-to=sympy.stats ^
            --nofollow-import-to=sympy.tensor ^
            --nofollow-import-to=sympy.plotting ^
            --nofollow-import-to=sympy.parsing.latex ^
            --nofollow-import-to=sympy.polys.polyquinticconst ^
            --nofollow-import-to=sympy.polys.numberfields ^
            --nofollow-import-to=sympy.combinatorics ^
            --nofollow-import-to=sympy.liealgebras ^
            --output-dir=build ^
            Funcora.py

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Funcora-Windows
          path: build/Funcora.dist
