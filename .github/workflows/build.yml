name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: Funcora-Linux
          - name: Windows
            os: windows-latest
            artifact: Funcora-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install nuitka PySide6 numpy matplotlib sympy

      - name: Cache Nuitka downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-python-3.12

      - name: Build standalone application with Nuitka
        if: runner.os == 'Linux'
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --jobs=2 \
            --low-memory \
            --lto=no \
            --enable-plugin=pyside6 \
            --include-data-dir=assets=assets \
            --output-dir=build \
            Funcora.py

      - name: Build standalone application with Nuitka
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --assume-yes-for-downloads `
            --jobs=2 `
            --low-memory `
            --lto=no `
            --windows-console-mode=disable `
            --windows-icon-from-ico=assets/icon.ico `
            --enable-plugin=pyside6 `
            --include-data-dir=assets=assets `
            --output-dir=build `
            Funcora.py

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          cd build/Funcora.dist
          zip -9 -r ../../Funcora-Linux.zip .

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/Funcora.dist/* -DestinationPath Funcora-Windows.zip -CompressionLevel Optimal

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0
