name: Build Funcora (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install --upgrade nuitka
          pip install pyside6 sympy numpy matplotlib pillow

      - name: Build Funcora
        shell: cmd
        run: |
          python -m nuitka ^
            --standalone ^
            --onefile ^
            --jobs=2 ^
            --lto=no ^
            --assume-yes-for-downloads ^
            --windows-console-mode=disable ^
            --enable-plugin=pyside6 ^
            --include-data-dir=assets=assets ^
            --include-windows-runtime-dlls=no ^
            --nofollow-import-to=tkinter ^
            --nofollow-import-to=IPython ^
            --nofollow-import-to=jupyter ^
            --nofollow-import-to=pytest ^
            --nofollow-import-to=sympy.testing ^
            --nofollow-import-to=sympy.physics ^
            --nofollow-import-to=sympy.stats ^
            --nofollow-import-to=sympy.tensor ^
            --nofollow-import-to=sympy.plotting ^
            --nofollow-import-to=sympy.parsing.latex ^
            --nofollow-import-to=sympy.polys.polyquinticconst ^
            --output-dir=build ^
            --output-filename=Funcora.exe ^
            Funcora.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Funcora-Windows
          path: build/Funcora.exe
