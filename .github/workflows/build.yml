name: Build Desktop Apps

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "release/**"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: Funcora-Linux
          - name: Windows
            os: windows-latest
            artifact: Funcora-Windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PySide6 numpy matplotlib sympy

      - name: Build standalone application
        if: runner.os != 'Windows'
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name Funcora \
            --add-data "assets:assets" \
            Funcora.py

      - name: Build standalone application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --name Funcora `
            --icon assets/icon.ico `
            --add-data "assets;assets" `
            Funcora.py

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          cd dist/Funcora
          zip -9 -r ../../Funcora-Linux.zip .

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/Funcora/* -DestinationPath Funcora-Windows.zip -CompressionLevel Optimal

      - name: Upload packaged application
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0
