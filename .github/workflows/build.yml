
name: Build Funcora (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade nuitka
          python -m pip install numpy sympy matplotlib PySide6

      - name: Show versions
        run: |
          python --version
          python -m nuitka --version

      - name: Build Funcora
        run: |
          python -m nuitka ^
            --onefile ^
            --standalone ^
            --lto=yes ^
            --windows-console-mode=disable ^
            --enable-plugin=pyside6 ^
            --include-data-dir=assets=assets ^
            --output-dir=build ^
            --output-filename=Funcora.exe ^
            Funcora.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Funcora-Windows
          path: build/Funcora.exe

