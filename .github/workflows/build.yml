name: Build Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r requirements.txt

      - name: Nuitka cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/Nuitka
          key: nuitka-linux-${{ runner.arch }}-${{ hashFiles('**/*.py') }}
          restore-keys: |
            nuitka-linux-${{ runner.arch }}-

      - name: Build with Nuitka
        run: |
          python -m nuitka \
            --standalone \
            --assume-yes-for-downloads \
            --jobs=2 \
            --low-memory \
            --lto=no \
            --enable-plugin=pyside6 \
            --enable-plugin=numpy \
            --enable-plugin=matplotlib \
            --include-data-dir=assets=assets \
            --include-package=sympy \
            --output-dir=build \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-build
          path: build/
